<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Интерактивный тренажёр по теме «Имя существительное» для 4 класса.">
  <title>Имя существительное: тренируюсь</title>
  <style>
    :root{--ink:#3d3442;--muted:#796d78;--cream:#fff9f2;--paper:#fff;--rose:#d96f8d;--rose-dark:#b94b6c;--pink:#fbe7ed;--peach:#ffe6d1;--mint:#dff2e9;--mint-ink:#287357;--line:#eddde1;--shadow:0 14px 38px rgba(86,49,64,.12)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 5%,#ffe7ef 0,transparent 23rem),radial-gradient(circle at 90% 96%,#ffead9 0,transparent 24rem),var(--cream);font:18px/1.48 "Segoe UI",Arial,sans-serif;color:var(--ink);min-height:100vh}
    button,input{font:inherit} button{cursor:pointer;border:0}.wrap{max-width:900px;margin:auto;padding:24px 20px 48px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px;font-weight:800;color:var(--rose-dark)}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:var(--rose);color:white;font-size:23px}
    .route{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 0 26px}.route span{padding:9px 5px;border-radius:11px;text-align:center;background:#f4ebec;color:#9b8c94;font-size:13px;font-weight:700}.route .active{color:white;background:var(--rose)}.route .done{color:var(--mint-ink);background:var(--mint)}
    .card{background:var(--paper);border:1px solid rgba(236,216,221,.75);box-shadow:var(--shadow);border-radius:26px;padding:clamp(24px,5vw,48px);animation:enter .42s ease both}.eyebrow{color:var(--rose-dark);font-weight:800;text-transform:uppercase;letter-spacing:.09em;font-size:13px}.title{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:10px 0 14px}.lead{font-size:20px;color:var(--muted);max-width:640px}.start-art{font-size:72px;margin:14px 0}.button-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{background:var(--rose);color:#fff;border-radius:14px;padding:14px 21px;font-weight:800;box-shadow:0 5px 0 var(--rose-dark);transition:transform .16s,box-shadow .16s}.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--rose-dark)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rose-dark)}.btn.secondary{background:#f8edf0;color:var(--rose-dark);box-shadow:0 5px 0 #e6cfd7}.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .progress{height:8px;background:#f5e9ed;border-radius:99px;margin:0 0 25px;overflow:hidden}.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),#ef9bb2);border-radius:99px;transition:width .45s ease}.counter{font-size:14px;font-weight:800;color:var(--muted);margin-bottom:8px}.question{font-size:clamp(25px,4vw,34px);line-height:1.27;margin:15px 0 23px}.note{background:#fff7df;border-left:4px solid #e9b73b;border-radius:10px;padding:12px 15px;color:#6d561b;font-size:16px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.option{padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:white;color:var(--ink);font-weight:700;text-align:left;transition:.16s}.option:hover{border-color:#e8a6b7;background:#fff8fa}.option.selected{border-color:var(--rose);background:var(--pink)}.feedback{margin-top:20px;padding:15px 17px;border-radius:13px;font-weight:650;display:none}.feedback.show{display:block;animation:enter .25s ease}.feedback.ok{color:var(--mint-ink);background:var(--mint)}.feedback.no{color:#9a3e59;background:var(--pink)}.feedback strong{display:block}.word{font-weight:850;color:var(--rose-dark);white-space:nowrap}.hint{margin-top:15px;border-radius:13px;padding:13px 15px;background:#f7f0f3;color:#665660;font-size:16px;display:none}.hint.show{display:block;animation:enter .25s ease}.field{border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-width:88px;max-width:160px;color:var(--rose-dark);font-weight:800;outline:none}.field:focus{border-color:var(--rose)}.field.right{border-color:#5ab28d;background:#f0fbf5}.field.wrong{border-color:#df7592;background:#fff4f6}.table{width:100%;border-collapse:separate;border-spacing:0 9px}.table td{background:#fff8fa;padding:12px}.table td:first-child{border-radius:11px 0 0 11px;font-weight:700}.table td:last-child{border-radius:0 11px 11px 0}.small{font-size:15px;color:var(--muted)}.finish{text-align:center}.finish .title{margin-top:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:27px 0}.stat{padding:17px 8px;border-radius:15px;background:#fff5f7}.stat b{display:block;font-size:28px;color:var(--rose-dark)}.hidden{display:none!important}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:600px){.route span{font-size:11px}.options{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.card{border-radius:20px}.table{font-size:16px}.table td{padding:8px}.field{min-width:65px;width:85px}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="brand"><div class="brand-mark">А</div><div>Русский язык · 4 класс</div></div>
  <nav class="route" aria-label="Маршрут тренажёра"><span data-route="0">Падеж</span><span data-route="1">Склонение</span><span data-route="2">Окончание</span><span data-route="3">Текст</span></nav>
  <section id="app" class="card"></section>
</main>
<script>
const stages=[
 {name:'Падеж',items:[
  {q:'Определи падеж выделенного существительного: <span class="word">На поляне</span> росли ромашки.',a:'П. п.',o:['И. п.','Р. п.','Д. п.','П. п.'],why:'Вопрос: где? на поляне. Это предложный падеж.'},
  {q:'Определи падеж: К <span class="word">бабушке</span> приехали внуки.',a:'Д. п.',o:['В. п.','Д. п.','Т. п.','П. п.'],why:'Вопрос: к кому? к бабушке. Это дательный падеж.'},
  {q:'Определи падеж: Вечером <span class="word">месяц</span> спрятался за тучей.',a:'И. п.',o:['И. п.','Р. п.','В. п.','Т. п.'],why:'Кто? что? месяц — подлежащее, именительный падеж.'},
  {q:'Определи падеж: Ребята любовались <span class="word">радугой</span>.',a:'Т. п.',o:['Р. п.','Д. п.','В. п.','Т. п.'],why:'Любовались кем? чем? радугой. Это творительный падеж.'}
 ]},
 {name:'Склонение',items:[
  {q:'Какого склонения существительное <span class="word">тетрадь</span>?',a:'3-е склонение',o:['1-е склонение','2-е склонение','3-е склонение'],why:'Тетрадь — существительное женского рода с мягким знаком на конце: 3-е склонение.'},
  {q:'Какого склонения существительное <span class="word">окно</span>?',a:'2-е склонение',o:['1-е склонение','2-е склонение','3-е склонение'],why:'Окно — существительное среднего рода на -о: 2-е склонение.'}
 ]},
 {name:'Окончание',items:[
  {q:'Выбери правильное окончание: Ребята стояли над веранд<span class="word">…</span>',a:'ой',o:['ой','е','и','ы'],why:'Над чем? над верандой. Творительный падеж, 1-е склонение.'},
  {q:'Выбери правильное окончание: В буфет<span class="word">…</span> продавали свежие булочки.',a:'е',o:['е','и','ы','ой'],why:'Где? в буфете. Предложный падеж, 2-е склонение.'},
  {q:'Выбери правильное окончание: Мы подошли к площадк<span class="word">…</span>.',a:'е',o:['е','и','ой','ы'],why:'К чему? к площадке. Дательный падеж, 1-е склонение.'}
 ]}
];
const worksheet=[
 ['В тетрад…', 'и','Предложный падеж, 3-е склонение: в тетради.'],
 ['К площадк…', 'е','Дательный падеж, 1-е склонение: к площадке.'],
 ['На ветк…', 'е','Предложный падеж, 1-е склонение: на ветке.'],
 ['О мыш…', 'и','Предложный падеж, 3-е склонение: о мыши.'],
 ['С книг…', 'ой','Творительный падеж, 1-е склонение: с книгой.']
];
let stage=0,index=0,attempts=0,correctFirst=0,helped=0,fixed=0,hard=[],reviewQueue=[],reviewMode=false;
const app=document.querySelector('#app');
function route(){document.querySelectorAll('[data-route]').forEach((x,i)=>x.className=i<stage?'done':i===stage?'active':'');}
function shell(inner){route();app.innerHTML=inner;}
function start(){stage=0;index=0;attempts=0;correctFirst=0;helped=0;fixed=0;hard=[];reviewQueue=[];reviewMode=false;showQuestion();}
function showStart(){document.querySelector('.route').classList.add('hidden');shell(`<div class="start-art">✍️</div><div class="eyebrow">Интерактивный тренажёр</div><h1 class="title">Имя существительное:<br>тренируюсь</h1><p class="lead">Повтори падежи, склонения и окончания существительных. Здесь можно ошибаться, думать и пробовать ещё раз.</p><div class="note"><b>Как работать:</b> выбери ответ, проверь себя и прочитай короткое объяснение.</div><div class="button-row"><button class="btn" onclick="start()">Начать тренировку →</button></div>`)}
function showQuestion(){document.querySelector('.route').classList.remove('hidden');let item=stages[stage].items[index], total=stages.flatMap(s=>s.items).length, done=stages.slice(0,stage).reduce((n,s)=>n+s.items.length,0)+index; shell(`<div class="counter">${stages[stage].name} · задание ${index+1} из ${stages[stage].items.length}</div><div class="progress"><b style="width:${done/total*100}%"></b></div><div class="eyebrow">Выбери ответ</div><div class="question">${item.q}</div><div class="options">${item.o.map(o=>`<button class="option" data-answer="${encodeURIComponent(o)}" onclick="choose(this)">${o}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div id="hint" class="hint"></div><div class="button-row"><button id="check" class="btn" disabled onclick="check()">Проверить</button><button class="btn secondary" onclick="hint()">Подсказка</button></div>`);}
let selected=null;function choose(el){document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selected=decodeURIComponent(el.dataset.answer);document.querySelector('#check').disabled=false}
function hint(){helped++;document.querySelector('#hint').classList.add('show');document.querySelector('#hint').innerHTML='Сначала задай вопрос к существительному. Затем вспомни: предлог тоже помогает определить падеж.'}
function check(){let item=stages[stage].items[index], f=document.querySelector('#feedback');attempts++;if(selected===item.a){if(!reviewMode){if(attempts===1)correctFirst++;else fixed++;} f.className='feedback show ok';f.innerHTML=`<strong>Верно! ✓</strong>${item.why}`;document.querySelectorAll('.option').forEach(x=>x.disabled=true);document.querySelector('#check').outerHTML='<button class="btn" onclick="next()">Продолжить →</button>'}else{hard.push({stage,index});f.className='feedback show no';f.innerHTML='<strong>Пока неверно.</strong> Попробуй ещё раз: прочитай предложение и задай вопрос к слову.';selected=null;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));document.querySelector('#check').disabled=true}}
function next(){if(reviewMode){nextReview();return}index++;attempts=0;if(index<stages[stage].items.length){showQuestion();return}stage++;index=0;if(stage<3){shell(`<div class="finish"><div class="start-art">✓</div><div class="eyebrow">Этап завершён</div><h1 class="title">Отличная работа!</h1><p class="lead">Ты повторила раздел «${stages[stage-1].name}». Переходим дальше.</p><div class="button-row" style="justify-content:center"><button class="btn" onclick="showQuestion()">Продолжить →</button></div></div>`)}else showWorksheet()}
function showWorksheet(){stage=3;route();shell(`<div class="counter">Текст · самостоятельная работа</div><div class="progress"><b style="width:100%"></b></div><div class="eyebrow">Заполни окончания</div><h1 class="question">Впиши нужные буквы</h1><p class="small">Работай по алгоритму: склонение → падеж → окончание.</p><table class="table"><tbody>${worksheet.map((x,i)=>`<tr><td>${i+1}.</td><td>${x[0].replace('…',`<input id="w${i}" class="field" aria-label="Окончание ${i+1}">`)}</td><td id="why${i}" class="small"></td></tr>`).join('')}</tbody></table><div id="workfeedback" class="feedback"></div><div class="button-row"><button class="btn" onclick="checkWork()">Проверить работу</button></div>`)}
function checkWork(){let all=true;worksheet.forEach((x,i)=>{let el=document.querySelector('#w'+i),cell=document.querySelector('#why'+i),val=el.value.trim().toLowerCase();el.classList.remove('right','wrong');if(val===x[1]){el.classList.add('right');cell.textContent='Верно ✓'}else{all=false;el.classList.add('wrong');cell.textContent=x[2]}});let f=document.querySelector('#workfeedback');f.className='feedback show '+(all?'ok':'no');f.innerHTML=all?'<strong>Самостоятельная работа выполнена верно! ✓</strong>Переходи к итогу.':'<strong>Есть неточности.</strong>Исправь слова, выделенные розовой рамкой, опираясь на пояснение.';if(all)document.querySelector('.button-row').innerHTML='<button class="btn" onclick="finish()">К итогу →</button>'}
function finish(){let unique=[...new Map(hard.map(x=>[x.stage+'-'+x.index,x])).values()];shell(`<div class="finish"><div class="start-art">🌟</div><div class="eyebrow">Тренировка завершена</div><h1 class="title">Ты справилась!</h1><p class="lead" style="margin:0 auto">Ты повторила падежи, склонения и правописание окончаний. Теперь можно выполнять задания без подсказок.</p><div class="stats"><div class="stat"><b>${correctFirst}</b>сразу получилось</div><div class="stat"><b>${helped}</b>подсказок открыто</div><div class="stat"><b>${unique.length}</b>сложных заданий</div></div><div class="button-row" style="justify-content:center">${unique.length?'<button class="btn secondary" onclick="repeatHard()">Повторить сложные задания</button>':''}<button class="btn" onclick="showStart()">Начать заново</button></div><p class="small">Авторский учебный материал · Русский язык, 4 класс</p></div>`)}
function repeatHard(){reviewQueue=[...new Map(hard.map(x=>[x.stage+'-'+x.index,x])).values()];if(!reviewQueue.length)return;reviewMode=true;let target=reviewQueue.shift();stage=target.stage;index=target.index;attempts=0;showQuestion()}
function nextReview(){if(reviewQueue.length){let target=reviewQueue.shift();stage=target.stage;index=target.index;attempts=0;showQuestion();return}reviewMode=false;finish()}
showStart();
</script>
</body>
</html>
